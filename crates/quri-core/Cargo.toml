[package]
name = "quri-core"
description = "quri is the Light Weight Database Client built on GPUI for Maximum Performance"
version = "0.1.0"
edition = "2021"

[dependencies]

anyhow = "1.0"
async-trait = "0.1"
log = "0.4"
tokio = "1.47.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3.1"

uuid = { version = "1.2", features = ["v4", "serde"] }
sqlx = { version = "0.8.6", features = ["sqlite", "postgres", "mysql", "runtime-tokio-native-tls", "chrono", "json", "uuid"] }

chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0.0"
image = "0.25.10"
