[package]
name = "quri-ui"
description = "quri is the Light Weight Database Client built on GPUI for Maximum Performance"
version.workspace = true
edition.workspace = true

[dependencies]
# quri
quri-core = { path = "../quri-core" }
quri-storage = { path = "../quri-storage" }

# gpui
gpui-kit = "0.7"

# serde
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error and Logging
anyhow = "1.0"
tracing = "0.1"

# Async
async-trait = "0.1"
tokio = "1.47.1"

# Image and assets
image = "0.25.10"
rust-embed = "8.11.0"
