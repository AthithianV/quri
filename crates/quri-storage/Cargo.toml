[package]
name = "quri-storage"
description = "quri-storage is for persistent storage of quri data"
version.workspace = true
edition.workspace = true

[dependencies]

anyhow = "1.0"
async-trait = "0.1"
tokio = "1.47.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3.1"

uuid = { version = "1.2", features = ["v4", "serde"] }
sqlx = { version = "0.8.6", features = ["sqlite", "postgres", "mysql", "runtime-tokio-native-tls", "chrono", "json", "uuid"] }

chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0.0"
